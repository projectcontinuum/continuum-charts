{{- if and .Values.clusterManager.enabled .Values.networkPolicy.workbenchIsolation.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: continuum-workbench-isolation
  namespace: {{ .Values.clusterManager.workbench.namespace }}
  labels:
    app.kubernetes.io/component: cluster-manager
    {{- include "continuum-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: continuum-workbench
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.workbenchIsolation.dns.namespace }}
          podSelector:
            matchLabels:
              {{- .Values.networkPolicy.workbenchIsolation.dns.podSelector | toYaml | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internet egress, deny cluster-internal (pod/service) CIDRs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.workbenchIsolation.clusterInternalCIDRs | nindent 14 }}
{{- end }}

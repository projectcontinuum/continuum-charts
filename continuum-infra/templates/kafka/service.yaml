{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum-infra.kafka.fullname" . }}
  labels:
    {{- include "continuum-infra.componentLabels" (dict "context" $ "component" "kafka" "extra" .Values.kafka.labels.service) | nindent 4 }}
  {{- with (include "continuum-infra.componentAnnotations" (dict "context" $ "extra" .Values.kafka.annotations.service)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 19092
      targetPort: broker
      protocol: TCP
      name: broker
  selector:
    app.kubernetes.io/component: kafka
    {{- include "continuum-infra.selectorLabels" . | nindent 4 }}
{{- end }}

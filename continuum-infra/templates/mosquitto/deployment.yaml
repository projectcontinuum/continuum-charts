{{- if .Values.mosquitto.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "continuum-infra.mosquitto.fullname" . }}
  labels:
    {{- include "continuum-infra.componentLabels" (dict "context" $ "component" "mosquitto" "extra" .Values.mosquitto.labels.deployment) | nindent 4 }}
  {{- with (include "continuum-infra.componentAnnotations" (dict "context" $ "extra" .Values.mosquitto.annotations.deployment)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: mosquitto
      {{- include "continuum-infra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuum-infra.componentLabels" (dict "context" $ "component" "mosquitto" "extra" .Values.mosquitto.labels.pod) | nindent 8 }}
      {{- with (include "continuum-infra.componentAnnotations" (dict "context" $ "extra" .Values.mosquitto.annotations.pod)) }}
      annotations:
        {{- nindent 8 . }}
      {{- end }}
    spec:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.mosquitto.config.tcpPort | default 1883 }}
              name: mqtt
              protocol: TCP
            - containerPort: {{ .Values.mosquitto.config.websocketPort | default 1884 }}
              name: websocket
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            {{- if .Values.mosquitto.persistence.enabled }}
            - name: data
              mountPath: /mosquitto/data
            - name: log
              mountPath: /mosquitto/log
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "continuum-infra.mosquitto.fullname" . }}-config
        {{- if .Values.mosquitto.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "continuum-infra.mosquitto.fullname" . }}-data
        - name: log
          persistentVolumeClaim:
            claimName: {{ include "continuum-infra.mosquitto.fullname" . }}-log
        {{- end }}
      {{- with .Values.mosquitto.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mosquitto.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

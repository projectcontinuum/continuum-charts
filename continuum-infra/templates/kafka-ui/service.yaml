{{- if .Values.kafkaUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum-infra.kafka-ui.fullname" . }}
  labels:
    {{- include "continuum-infra.componentLabels" (dict "context" $ "component" "kafka-ui" "extra" .Values.kafkaUi.labels.service) | nindent 4 }}
  {{- with (include "continuum-infra.componentAnnotations" (dict "context" $ "extra" .Values.kafkaUi.annotations.service)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: kafka-ui
    {{- include "continuum-infra.selectorLabels" . | nindent 4 }}
{{- end }}

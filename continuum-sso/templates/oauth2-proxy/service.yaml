{{- if .Values.oauth2Proxy.enabled }}
{{- $fullname := include "continuum-sso.fullname" . }}
{{- $service := .Values.oauth2Proxy.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-oauth2-proxy
  labels:
    {{- include "continuum-sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  type: {{ $service.type }}
  ports:
    - port: {{ $service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "continuum-sso.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
{{- end }}
